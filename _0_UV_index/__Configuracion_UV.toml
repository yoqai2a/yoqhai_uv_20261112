# Configuracion - Radiacion UV (NOMADS/NCEP)
# Usada por Descargar_UV.py y Generar_CSV_UV.py

[fecha]
# Fecha del directorio uvi.YYYYMMDD, como texto. "AUTO" = segun la hora UTC (ver abajo).
# Tambien puede ser una fecha fija, por ejemplo "20261104".
fecha = "AUTO"
# Con "AUTO": antes de esta hora UTC se usa la fecha de AYER; desde esta hora, la de HOY.
hora_cambio_utc = "18:30"

[descarga]
ciclo = "t12z"                    # t00z, t06z, t12z, t18z
productos = ["uv", "uvucs"]
hora_inicio = 1                   # grbf01
hora_fin = 120                    # grbf120
url_base = "https://nomads.ncep.noaa.gov/pub/data/nccf/com/uvi/prod"
destino = "../___Data/___UV/___UV_{FECHA}"   # relativo a ESTA carpeta; {FECHA} = fecha
reintentos = 10                   # veces que se reintenta cada archivo que falla o llega corrupto
espera = 10                       # base (s): espera antes del reintento k = espera*k + la espera anterior
espera_max = 60                   # tope (s) de cada espera: 10, 30, 60, 60, 60, ... (~9 min si nada se recupera)
                                  # 0 = sin tope (10, 30, 60, 100, 150, ... 550 s: ~37 min)
hilos = 16

[extraccion]
modo = "puntos"                   # "puntos" = varios lugares (tabla [puntos]) | "punto" = uno solo | "zona" = caja lat/lon
procesos = 0                      # procesos en paralelo al leer los GRIB2; 0 = automatico (nucleos, max 8)
solo_con_sol = false              # true omite filas nocturnas (uv y uvucs = 0)
factor_uvi = 40.0                 # valor GRIB (W/m2 eritemico) x 40 = indice UV (1 UVI = 25 mW/m2)
umbral_transmision = 0.1          # transmision solo si el UVI despejado supera este valor

# --- modo "punto" (un solo lugar; la grilla de NOAA es de 0.25 x 0.25 grados) ---
punto_nombre = "Punta Arenas"
punto_lat = -53.0
punto_lon = -70.83                # longitudes entre -180 y 180
metodo = "bilineal"               # "bilineal" (interpola 4 nodos) | "vecino" (nodo mas cercano); vale para "punto" y "puntos"

# --- modo "zona" (OJO: con grilla de 0.25 grados, una caja grande genera cientos de miles de filas) ---
lat_min = -56.0
lat_max = -17.0
lon_min = -76.0
lon_max = -66.0

[puntos]
# Estaciones, de NORTE a SUR (el visor muestra un boton por cada una, en este orden).
# "predeterminado" = la que se abre primero en el visor.
predeterminado = "SCCI"
SCHR = {lat = -47.24, lon = -72.59}
SCNT = {lat = -51.72, lon = -72.50}
SCCI = {lat = -53.00, lon = -70.85}
SCFM = {lat = -53.07, lon = -70.08}
SCGZ = {lat = -54.93, lon = -67.64}
SCRM = {lat = -62.17, lon = -58.91}

[historico]
# Archivo maestro (Excel): una hoja por estacion, una fila por fecha de ciclo, con el maximo
# diario del indice UV (cielo despejado y con nubosidad) de los dias 0 a 5.
activo = true
archivo = "../___Data/___UV/Historico_UV.xlsx"   # relativo a ESTA carpeta
desde = "2026-01-01"                             # primera fila del calendario
hasta = "2027-12-31"                             # ultima fila (si llega una fecha posterior, se extiende solo)

[limpieza]
# Las carpetas diarias (___Data/___UV/___UV_YYYYMMDD: GRIB, CSV y JSON) se conservan solo este numero de dias.
# El archivo maestro Historico_UV.xlsx NUNCA se borra. 0 = no borrar nada.
dias_a_conservar = 15

[csv]
archivo = "UV_{FECHA}.csv"        # se guarda dentro de la carpeta de destino
archivo_max_dia = "UV_{FECHA}_max_dia.csv"
archivo_max_dia_json = "UV_{FECHA}_max_dia.json"
agrupar_por = "bloque_24h"              # "bloque_24h" (dia1 = f01-f24, ...) | "dia_local" (calendario)
zona_horaria = "America/Punta_Arenas"   # para agrupar por dia local y dar la hora local
separador = ","
